<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Travel App</title>
    <!-- Same styles as register.html -->
</head>
<body>
    <div class="auth-container">
        <h1>Reset Password</h1>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="username">Enter your username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div id="message" class="message"></div>
            
            <button type="submit">Send Reset Link</button>
            
            <div class="login-link">
                Remember your password? <a href="/travelpage/login.html">Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const messageElement = document.getElementById('message');
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}`
                });
                
                if (response.ok) {
                    messageElement.textContent = 'If this username exists, you will receive reset instructions';
                    messageElement.className = 'message success';
                } else {
                    messageElement.textContent = 'Error processing your request';
                    messageElement.className = 'message error';
                }
            } catch (err) {
                messageElement.textContent = 'Network error. Please try again.';
                messageElement.className = 'message error';
            }
        });
    </script>
</body>
</html>
