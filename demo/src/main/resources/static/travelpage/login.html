<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel App</title>
    <style>
        /* Same styles as register.html */
       
        .forgot-password {
            text-align: middle;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .h1{
            text-align: center;
            color: rgb(12, 11, 13);
        }
        .username{
            color: black;
            size: 0cm;
        }
        .form-group{
            text-align: center;
            font-size: 20px;
        }
        .login{
        position: absolute;
        top: 50%;
        left: 60%;
        transform: translate(-50%, -50%);
            height: 30px;
            width: 60px;
            font-size: medium;
            color: blue;/* Centers both horizontally and vertically */ /* Adjust height as needed */
        }
        .login-link{
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        }
        .box {
    width: 250px;              /* Same width */
    height: 40px;              /* Same height */
    padding: 8px 12px;         /* Inner spacing */
    font-size: 16px;           /* Same text size */
    box-sizing: border-box;    /* Include padding in width/height */
    margin-bottom: 10px;       /* Optional: space between boxes */
    border: 1px solid #ccc;    /* Same border */
    border-radius: 5px;        /* Optional: rounded corners */
}

    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="h1">Welcome Back</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
            <div>
                <input class="box" type="text" id="username" name="username" required>
            </div>
            </div>
           
            <div class="form-group">
                <label for="password">Password</label>
                <div>
                    <input class="box" type="password" id="password" name="password" required>
                </div>
                <div class="forgot-password">
                    <a href="/travelpage/forgot-password.html">Forgot password?</a>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button class="login" type="submit">Login</button>
            
            <div class="login-link">
                Don't have an account? <a href="/travelpage/register.html">Register</a>
            </div>
        </form>
    </div>

    <script>
     document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const response = await fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        })
    });
    //src/main/resources/static/travelpage/index.html
    const result = await response.json();
    if (response.ok) {
        window.location.href = '/travelpage/index.html';
    } else {
        document.getElementById('errorMessage').textContent = result.error;
    }
});
        // Show success message if redirected from registration
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('registered')) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = 'Registration successful! Please login';
            messageElement.className = 'message success';
        }
    </script>
</body>
</html>
