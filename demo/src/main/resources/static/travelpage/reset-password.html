<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Travel App</title>
    <!-- Same styles as register.html -->
</head>
<body>
    <div class="auth-container">
        <h1>Create New Password</h1>
        
        <form id="resetPasswordForm">
            <input type="hidden" id="token" name="token">
            
            <div class="form-group">
                <label for="newPassword">New Password (min 8 characters)</label>
                <input type="password" id="newPassword" name="newPassword" minlength="8" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            
            <div id="message" class="message"></div>
            
            <button type="submit">Update Password</button>
        </form>
    </div>

    <script>
        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('token').value = token || '';
        
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = document.getElementById('token').value;
            const messageElement = document.getElementById('message');
            
            if (newPassword !== confirmPassword) {
                messageElement.textContent = "Passwords don't match";
                messageElement.className = 'message error';
                return;
            }
            
            if (!token) {
                messageElement.textContent = "Invalid reset link";
                messageElement.className = 'message error';
                return;
            }
            
            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `token=${encodeURIComponent(token)}&newPassword=${encodeURIComponent(newPassword)}`
                });
                
                if (response.ok) {
                    messageElement.textContent = 'Password updated successfully! Redirecting to login...';
                    messageElement.className = 'message success';
                    setTimeout(() => {
                        window.location.href = '/travelpage/login.html';
                    }, 2000);
                } else {
                    messageElement.textContent = 'Invalid or expired token';
                    messageElement.className = 'message error';
                }
            } catch (err) {
                messageElement.textContent = 'Network error. Please try again.';
                messageElement.className = 'message error';
            }
        });
    </script>
</body>
</html>
